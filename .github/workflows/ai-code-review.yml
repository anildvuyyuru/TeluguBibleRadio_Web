name: Copilot Code Review - Feature Branches

on:
  workflow_run:
    workflows: ["CI - Build, Test"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: copilot-review-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted workflow code only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test review guards
        run: node --test .github/scripts/ai-code-review.test.cjs

      - name: Request Copilot review for eligible PRs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const review = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ai-code-review.cjs`);
            await review({ github, context, core });
